<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayori's Bedroom - Server Connection</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #1e1e1e; padding: 35px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6); text-align: center; max-width: 450px; width: 90%; border: 1px solid #333; }
        h1 { color: #ff79c6; margin-top: 0; margin-bottom: 10px; font-size: 28px; letter-spacing: 0.5px; }
        p { color: #a9b7c6; font-size: 14px; line-height: 1.5; margin-bottom: 25px; }
        .link-container { position: relative; margin-bottom: 20px; }
        .link-box { background-color: #2b2b2b; border: 2px solid #ff79c6; padding: 14px; border-radius: 8px; font-family: 'Consolas', 'Courier New', monospace; font-size: 15px; color: #50fa7b; word-break: break-all; user-select: all; }
        button { background-color: #ff79c6; color: #121212; border: none; padding: 12px 28px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s ease-in-out; box-shadow: 0 4px 10px rgba(255, 121, 198, 0.3); }
        button:hover { background-color: #ff92df; transform: translateY(-1px); box-shadow: 0 6px 14px rgba(255, 121, 198, 0.4); }
        button:disabled { background-color: #444; color: #888; cursor: not-allowed; box-shadow: none; }
        .status { font-size: 13px; color: #8be9fd; margin-top: 15px; height: 18px; font-weight: 500; }
    </style>
</head>
<body>
<div class="container">
    <h1>Sayori's Bedroom</h1>
    <p>The server address changes automatically every time it boots up. Copy the WebSocket link below and add it directly to your Eaglercraft multiplayer server list!</p>
    <div class="link-container">
        <div class="link-box" id="server-url">wss://abf437e5bf4f920b-76-158-48-134.serveousercontent.com</div>
    </div>
    <button onclick="copyLink()" >Copy Link</button>
    <div class="status" id="status-text"></div>
</div>
<script>
    function copyLink() {
        const linkText = document.getElementById('server-url').innerText;
        if (linkText && !linkText.includes("offline")) {
            navigator.clipboard.writeText(linkText).then(() => {
                const status = document.getElementById('status-text');
                status.innerText = "Copied to clipboard! Go paste it in-game.";
                setTimeout(() => status.innerText = "", 4000);
            });
        }
    }
</script>
</body>
</html>
